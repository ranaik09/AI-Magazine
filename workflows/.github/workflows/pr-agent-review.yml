name: PR Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cicd-review-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/cicd-review-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests -q

      - name: Run agent
        run: python main.py
